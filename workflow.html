<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Team Claude ships STRAINA</title>
<style>
:root{color-scheme:dark;--cy:#38e8ff;--mg:#ff2bd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:#000;color:#eaf6ff;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}
#hud{position:fixed;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;pointer-events:none;letter-spacing:.14em;font-size:clamp(13px,3vw,20px);text-shadow:0 0 14px var(--cy)}
#hud small{display:block;margin-top:4px;font-size:.7em;color:var(--mg);letter-spacing:.2em;text-shadow:none}
.tag{position:fixed;left:0;top:0;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:40px;background:rgba(4,4,8,.82);border:1.5px solid var(--c);box-shadow:0 0 18px -2px var(--c);pointer-events:none;will-change:transform;white-space:nowrap}
.tag img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:1.5px solid var(--c)}
.tag b{display:block;font-size:13px;letter-spacing:.08em}
.tag em{display:block;font-style:normal;font-size:11px;color:var(--c)}
#ui{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
#ui span{font-size:12px;opacity:.6}
#ui button{background:rgba(10,16,30,.8);color:#eaf6ff;border:1px solid rgba(56,232,255,.5);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
#ov{pointer-events:none;z-index:3}
#pipe{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:5px;padding:0 8px;flex-wrap:wrap;z-index:7;pointer-events:none}
#pipe span{font-size:clamp(9px,2.2vw,13px);letter-spacing:.1em;padding:5px 9px;border-radius:14px;border:1px solid #1d3b45;background:rgba(0,0,0,.6);color:#5d7c86;transition:.3s}
#pipe span.done{background:var(--cy);color:#001418;border-color:var(--cy)}
#pipe span.cur{border-color:var(--mg);color:#fff;box-shadow:0 0 14px var(--mg);animation:pl 1s infinite alternate}
@keyframes pl{to{background:rgba(255,43,214,.35)}}
#bub{position:fixed;z-index:8;padding:10px 14px;border-radius:16px;background:rgba(6,8,14,.93);border:1.5px solid var(--c);box-shadow:0 0 22px -4px var(--c);font-size:clamp(13px,3.4vw,17px);line-height:1.35;opacity:0;transition:opacity .25s;pointer-events:none}
#bub small{display:block;color:var(--c);font-size:.72em;letter-spacing:.12em;margin-bottom:3px}
#pan{position:fixed;z-index:7;padding:12px 14px;border-radius:14px;background:rgba(6,10,16,.9);border:1px solid #1d3b45;box-shadow:0 0 28px -8px var(--cy);font-size:clamp(11px,2.8vw,14px);pointer-events:none;left:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(30vw,300px)}
@media(orientation:portrait){#pan{left:50%;bottom:auto;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(80vw,320px)}}
#pan h4{margin:0 0 2px;color:var(--cy);letter-spacing:.14em;font-size:1.1em}
#pan small{display:block;opacity:.65;margin-bottom:8px}
.bar{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--cy),var(--mg));margin:6px 0}
.wf i,.wf b,.wf u{display:block;border-radius:5px;margin:5px 0}
.wf i{height:14px;background:var(--cy)}.wf b{height:24px;border:1.5px solid var(--mg)}.wf u{height:16px;width:50%;background:var(--mg)}
pre{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:.92em;color:#bfefff;white-space:pre-wrap;min-height:6.4em}
.ok{color:#5dffb0}.live{font-size:1.5em;font-weight:700;letter-spacing:.12em;text-align:center;text-shadow:0 0 18px var(--cy);color:#fff}
.prog{height:9px;border-radius:5px;background:#12202a;overflow:hidden;margin:8px 0}.prog div{height:100%;background:linear-gradient(90deg,var(--cy),var(--mg))}
.chip{position:fixed;left:0;top:0;z-index:8;padding:5px 11px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.1em;background:var(--c);color:#000;box-shadow:0 0 16px var(--c);opacity:0;pointer-events:none}
#ttl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 8vw;z-index:9;background:#000;font-size:clamp(22px,6vw,56px);letter-spacing:.12em;text-shadow:0 0 22px var(--cy);transition:opacity .7s;pointer-events:none}
#ttl i{display:block;font-style:normal;font-size:.4em;color:var(--mg);margin-top:.8em;text-shadow:none}
</style></head><body>
